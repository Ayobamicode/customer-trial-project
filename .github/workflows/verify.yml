name: Verify customer application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: customerdb
          POSTGRES_USER: customer_app
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U customer_app -d customerdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Angular dependencies
        run: npm ci --prefix frontend

      - name: Build Angular frontend
        run: npm run build --prefix frontend

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Initialize test database schema
        env:
          PGPASSWORD: ci-test-password
        run: psql -h 127.0.0.1 -p 5432 -U customer_app -d customerdb -v ON_ERROR_STOP=1 -f database/schema.sql

      - name: Run Spring Boot integration tests
        working-directory: backend
        env:
          DATABASE_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/customerdb
          DATABASE_USER: customer_app
          DATABASE_PASSWORD: ci-test-password
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
