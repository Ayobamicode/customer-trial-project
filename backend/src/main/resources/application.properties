spring.application.name=customer-api
server.address=127.0.0.1
server.port=8000
spring.config.import=optional:file:./.runtime/application-local.properties,optional:file:../.runtime/application-local.properties
spring.datasource.url=${DATABASE_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/customerdb}
spring.datasource.username=${DATABASE_USER:customer_app}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
